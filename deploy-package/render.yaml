services:
  - type: web
    name: investor-reminiscence
    env: node
    plan: starter
    rootDir: outputs
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: FORCE_SECURE_COOKIES
        value: "true"
    disk:
      name: investor-reminiscence-data
      mountPath: /var/data
      sizeGB: 1
